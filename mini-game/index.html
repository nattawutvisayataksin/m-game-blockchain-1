<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Nitro Racer (Grand Prix 8-Racer Edition)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #080b12;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #1e283d;
      border-radius: 14px;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 240, 255, 0.2);
      background: #10141f;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #0d121c;
    }
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(13, 17, 27, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 9px 18px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .hud-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #7b88a8;
      font-weight: 600;
    }
    .hud-value {
      font-size: 22px;
      font-weight: 800;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }
    .hud-sub {
      font-size: 12px;
      color: #ffd000;
      font-weight: 600;
    }
    #boost-meter-container {
      width: 150px;
      height: 11px;
      background: #1c2436;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    #boost-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff9900, #ff0055, #00f0ff);
      box-shadow: 0 0 10px #ff0055;
      transition: width 0.05s linear;
    }
    #center-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(10, 13, 22, 0.95);
      border: 2px solid #00f0ff;
      padding: 26px 42px;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
      display: none;
    }
    #center-message h2 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #00f0ff;
    }
    #center-message p {
      font-size: 15px;
      color: #c0c8de;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    #center-message button {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      border: none;
      color: #000;
      font-weight: 800;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #center-message button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00f0ff;
    }
    #controls-hint {
      margin-top: 14px;
      font-size: 13px;
      color: #7b88a8;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      background: #1e2638;
      border: 1px solid #3c4b69;
      border-radius: 5px;
      color: #00f0ff;
      font-weight: 700;
    }
    .highlight {
      color: #ff0077;
      font-weight: bold;
    }
    .highlight-gold {
      color: #ffd700;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
    
    <!-- HUD -->
    <div id="ui-overlay">
      <div class="hud-card">
        <span class="hud-title">รอบการแข่งขัน</span>
        <span id="lap-display" class="hud-value">1 / 2</span>
        <span id="lap-time" class="hud-sub">เวลา: 0.00s</span>
      </div>

      <div class="hud-card" style="align-items: center;">
        <span class="hud-title">ความเร็ว</span>
        <span id="speed-display" class="hud-value">0 KM/H</span>
        <span id="drift-score" class="hud-sub">DRIFT: 0</span>
      </div>

      <div class="hud-card" style="align-items: flex-end;">
        <span class="hud-title">NITRO BOOST (SPACE)</span>
        <div id="boost-meter-container">
          <div id="boost-fill"></div>
        </div>
        <span id="rank-display" class="hud-sub" style="margin-top: 5px; font-weight: bold; color: #00f0ff;">อันดับ 1 / 8</span>
      </div>
    </div>

    <!-- Modal Message -->
    <div id="center-message">
      <h2 id="msg-title">จบการแข่งขัน!</h2>
      <p id="msg-desc">เวลาทั้งหมดของคุณ: 00:00.00</p>
      <button id="restart-btn" onclick="restartRace()">แข่งใหม่อีกครั้ง</button>
    </div>
  </div>

  <div id="controls-hint">
    🎮 การควบคุม: <span class="badge">W</span> เร่ง &nbsp;|&nbsp; 
    <span class="badge">S</span> เบรก &nbsp;|&nbsp; 
    <span class="badge">A</span> <span class="badge">D</span> เลี้ยว &nbsp;|&nbsp; 
    <span class="badge">Spacebar</span> ดริฟต์/ไนโตร &nbsp;|&nbsp; 
    🏎️ <span class="highlight-gold">8 นักแข่งในสนาม</span> &nbsp;|&nbsp;
    🏁 <span class="highlight">Mega Straight 3,200px</span>: ทางตรงยาวระดับตำนาน เร่งสปีดแซงสะใจ!
  </div>

  <script src="game.js"></script>
</body>
</html>
